<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dev1ls — Desarrollador</title>
    <meta name="description" content="dev1ls — Desarrollador full-stack, BSD & Linux user.">
    <meta property="og:title" content="dev1ls">
    <meta property="og:description" content="Desarrollador full-stack, BSD & Linux user.">
    <meta property="og:image" content="https://res.cloudinary.com/djeqn9kjl/image/upload/v1781920013/eric_oumzl2.png">
    <meta property="og:url" content="https://dev1lsconf.github.io">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👹</text></svg>">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #111;
            --muted: #666;
            --faint: #999;
            --line: #e0e0e0;
            --icon-email: #666;
            --icon-x: #000;
            --icon-masto: #6364FF;
            --icon-gh: #181717;
            --star-color: rgba(17, 17, 17, 0.6);
            --star-glow: rgba(17, 17, 17, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --fg: #f0f0f0;
                --muted: #999;
                --faint: #555;
                --line: #222;
                --icon-email: #999;
                --icon-x: #fff;
                --icon-masto: #8b8dff;
                --icon-gh: #fff;
                --star-color: rgba(240, 240, 240, 0.7);
                --star-glow: rgba(240, 240, 240, 0.4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg);
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        body {
            background-color: transparent;
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 2rem;
            border: 1px solid var(--line);
            transition: opacity 0.3s ease;
        }

        .avatar:hover {
            opacity: 0.7;
        }

        .logo {
            font-size: 7rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--fg);
            user-select: none;
            line-height: 1;
        }

        .bio {
            margin-top: 0.75rem;
            font-size: 1.15rem;
            color: var(--muted);
        }

        .links {
            margin-top: 2rem;
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .links a {
            text-decoration: none;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
        }

        .links a:hover {
            opacity: 0.6;
        }

        .links svg {
            width: 32px;
            height: 32px;
        }

        .section {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0 1rem;
            display: none;
        }

        .section#repos {
            max-width: 900px;
        }

        .section.visible {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .section-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--faint);
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .section-list {
            list-style: none;
            text-align: center;
        }

        .section-list li {
            margin-bottom: 0.5rem;
        }

        .section-list a {
            color: var(--muted);
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .section-list a:hover {
            color: var(--fg);
        }

        .section-list .date {
            font-size: 0.7rem;
            color: var(--faint);
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        .repo-card {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: var(--fg);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            border-color: var(--muted);
        }

        @media (prefers-color-scheme: dark) {
            .repo-card:hover {
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            }
        }

        .repo-card-image {
            width: 100%;
            height: 160px;
            background: var(--line);
            object-fit: cover;
        }

        .repo-card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .repo-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .repo-card-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.3;
        }

        .repo-card-language {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .repo-card-language-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--line);
        }

        .repo-card-description {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 0.75rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .repo-card-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--faint);
        }

        .repo-card-stat {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        @media (max-width: 768px) {
            .logo { font-size: 4.5rem; }
            .avatar { width: 130px; height: 130px; }
        }

        @media (max-width: 480px) {
            .logo { font-size: 3rem; }
            .avatar { width: 100px; height: 100px; }
            .links { gap: 2rem; }
            .links svg { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

    <div class="section" id="repos">
        <div class="section-title">Repos</div>
        <div class="repos-grid" id="reposGrid"></div>
    </div>

    <script>
        async function loadRepos() {
            try {
                const res = await fetch('https://api.github.com/users/dev1lsconf/repos?sort=updated&per_page=12&type=public');
                if (!res.ok) throw new Error();
                const repos = await res.json();
                const grid = document.getElementById('reposGrid');

                const langColors = {
                    'JavaScript': '#f1e05a', 'TypeScript': '#2b7489', 'Python': '#3572A5',
                    'HTML': '#e34c26', 'CSS': '#563d7c', 'Rust': '#dea584',
                    'Go': '#00ADD8', 'Dockerfile': '#384d54', 'Shell': '#89e051',
                    'Vue': '#41b883', 'Svelte': '#ff3e00', 'Astro': '#ff5a03'
                };

                function hasImagesInReadme(readmeContent) {
                    if (!readmeContent) return false;
                    const markdownImages = readmeContent.match(/!\[.*?\]\((.*?)\)/g);
                    const htmlImages = readmeContent.match(/<img\s+[^>]*src=["']([^"']+)["']/gi);
                    return (markdownImages && markdownImages.length > 0) || (htmlImages && htmlImages.length > 0);
                }

                function extractFirstImage(readmeContent) {
                    if (!readmeContent) return null;
                    const mdMatch = readmeContent.match(/!\[.*?\]\((.*?)\)/);
                    if (mdMatch) return mdMatch[1];
                    const htmlMatch = readmeContent.match(/<img\s+[^>]*src=["']([^"']+)["']/i);
                    if (htmlMatch) return htmlMatch[1];
                    return null;
                }

                async function checkOpenGraphImage(fullName) {
                    const url = `https://opengraph.githubassets.com/1/${fullName}`;
                    try {
                        const r = await fetch(url, { method: 'HEAD' });
                        return r.ok ? url : null;
                    } catch {
                        return null;
                    }
                }

                const excludedRepos = ['dev1lsconf', 'nixos-config', 'twtxt_tui', 'blog', 'grasa-club'];

                for (const r of repos) {
                    if (r.fork) continue;
                    if (excludedRepos.includes(r.name)) continue;

                    let imageUrl = null;

                    try {
                        const readmeRes = await fetch(`https://api.github.com/repos/${r.full_name}/readme`, {
                            headers: { 'Accept': 'application/vnd.github.v3.raw' }
                        });
                        if (readmeRes.ok) {
                            const readmeContent = await readmeRes.text();
                            if (hasImagesInReadme(readmeContent)) {
                                const extracted = extractFirstImage(readmeContent);
                                if (extracted) {
                                    imageUrl = extracted.startsWith('http') ? extracted : `https://raw.githubusercontent.com/${r.full_name}/${r.default_branch}/${extracted}`;
                                }
                            }
                        }
                    } catch (_) {}

                    if (!imageUrl) {
                        imageUrl = await checkOpenGraphImage(r.full_name);
                    }

                    if (!imageUrl) continue;

                    const card = document.createElement('a');
                    card.className = 'repo-card';
                    card.href = r.html_url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';

                    const langColor = langColors[r.language] || '#666';
                    const description = r.description || 'Sin descripción';

                    card.innerHTML = `
                        <img class="repo-card-image" src="${imageUrl}" alt="" loading="lazy" onerror="this.style.display='none'">
                        <div class="repo-card-content">
                            <div class="repo-card-header">
                                <span class="repo-card-name">${r.name}</span>
                                ${r.language ? `<span class="repo-card-language"><span class="repo-card-language-dot" style="background:${langColor}"></span>${r.language}</span>` : ''}
                            </div>
                            <p class="repo-card-description">${description}</p>
                            <div class="repo-card-stats">
                                <span class="repo-card-stat">⭐ ${r.stargazers_count}</span>
                                <span class="repo-card-stat">🍴 ${r.forks_count}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
                if (grid.children.length) document.getElementById('repos').classList.add('visible');
            } catch (_) {}
        }

        document.addEventListener('DOMContentLoaded', () => { loadRepos(); initStarfield(); });

        function initStarfield() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let stars = [];
            let animationId = null;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createStars() {
                stars = [];
                const starCount = Math.min(800, Math.floor((canvas.width * canvas.height) / 8000));
                for (let i = 0; i < starCount; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 1.5 + 0.3,
                        alpha: Math.random() * 0.5 + 0.2,
                        delta: (Math.random() - 0.5) * 0.02,
                        speed: Math.random() * 0.3 + 0.1
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const baseRgb = isDark ? '240, 240, 240' : '17, 17, 17';

                stars.forEach(star => {
                    star.alpha += star.delta;
                    if (star.alpha <= 0.15 || star.alpha >= 0.95) {
                        star.delta = -star.delta;
                    }
                    star.y -= star.speed;
                    if (star.y < -star.radius) {
                        star.y = canvas.height + star.radius;
                        star.x = Math.random() * canvas.width;
                    }

                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${baseRgb}, ${star.alpha})`;
                    ctx.fill();

                    if (star.radius > 1) {
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = `rgba(${baseRgb}, ${star.alpha * 0.6})`;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                });

                animationId = requestAnimationFrame(draw);
            }

            function start() {
                resize();
                createStars();
                draw();
            }

            function stop() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
            }

            window.addEventListener('resize', () => {
                resize();
                createStars();
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                createStars();
            });

            start();
        }
    </script>
